name: Supabase Keep-Alive Ping

on:
  schedule:
    # 매 3일마다 자정(00:00 UTC)에 자동 실행하여 7일 비활성화 방지
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 수동 실행 트리거

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # 실패(401 등)하면 워크플로도 실패로 표시되도록 -f 사용
          curl -sf -X GET "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" > /dev/null
          echo "Supabase Keep-Alive ping successfully sent!"
